plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
     // This should be below the net.minecraftforge.gradle plugin
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.6.31-1.20.1'
group = 'cn.mcmod_mmf.mysterious_mountain_lib'
archivesBaseName = 'mysterious_mountain_lib'

// Mixin
apply plugin: 'org.spongepowered.mixin'

mixin {
    // MixinGradle Settings
    add sourceSets.main, 'mixins.mmlib.refmap.json'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: 'official', version: '1.20.1'
	accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=mixins.mmlib.json'
		    // Export mixin-changed classes
		    property 'mixin.debug.export', 'true'
			property 'mixin.env.remapRefMap', 'true'
            property 'forge.enabledGameTestNamespaces', 'mysterious_mountain_lib'
            mods {
                mysterious_mountain_lib {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=mixins.mmlib.json'
		    // Export mixin-changed classes
		    property 'mixin.debug.export', 'true'
			property 'mixin.env.remapRefMap', 'true'
            property 'forge.enabledGameTestNamespaces', 'mysterious_mountain_lib'
            mods {
                mysterious_mountain_lib {
                    source sourceSets.main
                }
            }
        }
        gameTestServer {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=mixins.mmlib.json'
		    // Export mixin-changed classes
		    property 'mixin.debug.export', 'true'
			property 'mixin.env.remapRefMap', 'true'
            property 'forge.enabledGameTestNamespaces', 'mysterious_mountain_lib'

            mods {
                mysterious_mountain_lib {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=mixins.mmlib.json'
		    // Export mixin-changed classes
		    property 'mixin.debug.export', 'true'
			property 'mixin.env.remapRefMap', 'true'
            property 'forge.enabledGameTestNamespaces', 'mysterious_mountain_lib'
			args '--mod', 'mysterious_mountain_lib', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                mysterious_mountain_lib {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.11'
        // Apply Mixin AP
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    compileOnly           "org.projectlombok:lombok:1.18.38"
    annotationProcessor   "org.projectlombok:lombok:1.18.38"
    
    implementation fg.deobf("maven.modrinth:acceleratedrendering:1.0.6-1.20.1-alpha")
    
}


// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
            "Specification-Title": "mysterious_mountain_lib",
            "Specification-Vendor": "mcmod.cn",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"mcmod.cn",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "mixins.mmlib.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allJava
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            url "file://${maven_loc}"
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
